<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Masuk ke akun Donaria Anda untuk berdonasi dan mengelola riwayat donasi.">
  <title>Masuk — Donaria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card animate-fade-in-up">
      <div class="logo">
        <h2><i data-lucide="heart-handshake" class="icon-lg" style="color:var(--primary);"></i> Donaria</h2>
      </div>
      <h3>Selamat Datang Kembali</h3>
      <p class="subtitle">Masuk ke akun Anda untuk melanjutkan berdonasi</p>
      <div id="loginError" class="alert alert-error hidden">
        <span><svg class="icon-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg></span>
        <span id="loginErrorMsg"></span>
      </div>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" class="form-control" placeholder="nama@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" class="form-control" placeholder="Masukkan password" required autocomplete="current-password">
            <button type="button" class="password-toggle" onclick="togglePassword('password',this)" aria-label="Tampilkan password"><i data-lucide="eye" class="icon-md"></i></button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">Masuk</button>
      </form>
      <div class="auth-footer">Belum punya akun? <a href="register.html">Daftar sekarang</a></div>
    </div>
  </div>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (Auth.isLoggedIn()) {
      window.location.href = Auth.isAdmin() ? 'admin/index.html' : 'dashboard.html';
    }
    function togglePassword(id,btn){
      const el=document.getElementById(id);
      const show=el.type==='password';
      el.type=show?'text':'password';
      btn.setAttribute('aria-label',show?'Sembunyikan password':'Tampilkan password');
      btn.innerHTML=show?'<i data-lucide="eye-off" class="icon-md"></i>':'<i data-lucide="eye" class="icon-md"></i>';
      refreshIcons();
    }
    async function handleLogin(e){
      e.preventDefault();
      const btn=document.getElementById('loginBtn'),errorBox=document.getElementById('loginError'),errorMsg=document.getElementById('loginErrorMsg');
      btn.disabled=true;btn.innerHTML='<div class="spinner" style="width:20px;height:20px;border-width:2px;"></div> Memproses...';errorBox.classList.add('hidden');
      try{
        const res=await API.login(document.getElementById('email').value,document.getElementById('password').value);
        if(res?.success){showToast('Login berhasil! Mengalihkan...','success');setTimeout(()=>{const u=Auth.getUser();window.location.href=u?.role==='admin'?'admin/index.html':'dashboard.html';},800);}
      }catch(error){errorMsg.textContent=error.message||'Email atau password salah.';errorBox.classList.remove('hidden');btn.disabled=false;btn.textContent='Masuk';}
    }
  </script>
</body>
</html>
