<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pembayaran donasi — Donaria">
  <title>Pembayaran — Donaria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .payment-page{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:40px 24px;background:linear-gradient(135deg,#ECFDF5 0%,#D1FAE5 50%,#F0FDF4 100%);}
    .payment-card{background:white;border-radius:var(--radius-xl);padding:40px;width:100%;max-width:500px;box-shadow:var(--shadow-xl);text-align:center;}
    .payment-card h2{margin-bottom:8px;}.payment-card .subtitle{color:var(--text-secondary);margin-bottom:32px;font-size:0.95rem;}
    .payment-amount{font-size:2rem;font-weight:800;color:var(--primary-dark);margin-bottom:8px;}
    .payment-timer{display:flex;align-items:center;justify-content:center;gap:8px;font-size:0.9rem;color:var(--warning);font-weight:600;margin-bottom:32px;padding:12px;background:#FFFBEB;border-radius:var(--radius-md);}
    .payment-status{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:var(--radius-full);font-weight:600;font-size:0.95rem;margin-bottom:32px;}
    .status-pending{background:#FEF3C7;color:#D97706;}.status-success{background:#DCFCE7;color:#16A34A;}.status-failed{background:#FEE2E2;color:#DC2626;}
    .instructions-accordion{text-align:left;margin-top:24px;border:1px solid var(--gray-200);border-radius:var(--radius-md);overflow:hidden;}
    .instruction-header{padding:14px 20px;background:var(--gray-50);font-weight:600;font-size:0.9rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--gray-200);}
    .instruction-header:hover{background:var(--gray-100);}
    .instruction-body{padding:16px 20px;font-size:0.85rem;color:var(--text-secondary);display:none;line-height:1.8;}
    .instruction-body.show{display:block;}.instruction-body ol{padding-left:20px;list-style:decimal;}.instruction-body ol li{margin-bottom:6px;}
  </style>
</head>
<body>
  <div class="payment-page">
    <div class="payment-card animate-fade-in-up" id="paymentContent">
      <div style="margin-bottom:24px;"><a href="index.html" style="font-size:1.3rem;font-weight:800;color:var(--primary-dark);display:inline-flex;align-items:center;gap:8px;"><i data-lucide="heart-handshake" class="icon-lg"></i> Donaria</a></div>
      <div class="spinner" style="margin:40px auto;"></div>
      <p>Memuat data pembayaran...</p>
    </div>
  </div>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    const orderId=new URLSearchParams(window.location.search).get('order_id');let paymentData=null,checkInterval=null;
    function loadPayment(){const stored=localStorage.getItem('donaria_payment');if(stored){paymentData=JSON.parse(stored);renderPayment();}else if(orderId){renderCheckStatus();}else{window.location.href='campaigns.html';}}
    function renderPayment(){
      const tx=paymentData.transaction,isQris=tx.payment_method==='qris',expDate=new Date(tx.expired_at);
      document.getElementById('paymentContent').innerHTML=`
      <div style="margin-bottom:24px;display:flex;align-items:center;gap:12px;">
        <a href="javascript:history.back()" class="btn-back" title="Kembali" style="width:36px;height:36px;border-radius:8px;background:var(--glass-bg);border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);transition:var(--transition-fast);">
          <i data-lucide="arrow-left" style="width:18px;height:18px;"></i>
        </a>
        <a href="index.html" style="font-size:1.3rem;font-weight:800;color:var(--primary-dark);display:inline-flex;align-items:center;gap:8px;"><i data-lucide="heart-handshake" class="icon-lg"></i> Donaria</a>
      </div>
        <h2>Selesaikan Pembayaran</h2><p class="subtitle">Order ID: ${tx.order_id}</p>
        <div class="payment-amount">${formatCurrency(tx.amount)}</div>
        <div class="payment-timer" id="paymentTimer"><i data-lucide="clock" class="icon-md"></i> Bayar sebelum: <span id="timerCountdown">${expDate.toLocaleString('id-ID')}</span></div>
        <div class="payment-status status-pending" id="paymentStatus"><i data-lucide="hourglass" class="icon-md"></i> Menunggu Pembayaran</div>
        ${isQris?`<div class="qr-display">${tx.qris_url?`<div class="qr-code"><img src="${tx.qris_url}" alt="QR Code QRIS" onerror="this.parentElement.innerHTML='<p>QR tidak tersedia.</p>';"></div>`:''} ${tx.qr_string?`<p style="font-size:0.8rem;color:var(--text-muted);word-break:break-all;">QR String: ${tx.qr_string}</p>`:''}<p style="font-size:0.9rem;color:var(--text-secondary);margin-top:12px;">Scan QR code di atas menggunakan aplikasi e-wallet atau mobile banking Anda</p></div>`:`<div class="va-display"><p style="font-size:0.9rem;color:var(--text-secondary);margin-bottom:8px;">Transfer ke Virtual Account ${(tx.bank_code||'').toUpperCase()}</p><div class="va-number">${tx.va_number||'-'}</div><button class="copy-btn" onclick="copyVA('${tx.va_number}')"><i data-lucide="copy" class="icon-sm"></i> Salin Nomor VA</button></div>`}
        ${tx.checkout_url?`<div style="margin-top:24px;"><a href="${tx.checkout_url}" target="_blank" class="btn btn-primary btn-block"><i data-lucide="external-link" class="icon-sm"></i> Buka Halaman Pembayaran Tripay</a></div>`:''}
        ${tx.instructions?.length>0?`<div class="instructions-accordion">${tx.instructions.map((inst,i)=>`<div class="instruction-header" onclick="toggleInstruction(${i})">${inst.title||'Cara Bayar'} <i data-lucide="chevron-down" class="icon-sm"></i></div><div class="instruction-body" id="instructionBody${i}"><ol>${(inst.steps||[]).map(s=>`<li>${s}</li>`).join('')}</ol></div>`).join('')}</div>`:''}
        <div style="margin-top:32px;"><a href="dashboard.html" class="btn btn-outline btn-block"><i data-lucide="bar-chart-3" class="icon-sm"></i> Ke Dashboard</a></div>`;
      refreshIcons();startCountdown(expDate);startStatusPolling(tx.order_id);
    }
    function renderCheckStatus(){
      document.getElementById('paymentContent').innerHTML=`<div style="margin-bottom:24px;"><a href="index.html" style="font-size:1.3rem;font-weight:800;color:var(--primary-dark);display:inline-flex;align-items:center;gap:8px;"><i data-lucide="heart-handshake" class="icon-lg"></i> Donaria</a></div><div class="spinner" style="margin:24px auto;"></div><h2>Mengecek Status Pembayaran</h2><p class="subtitle">Order ID: ${orderId}</p><div id="checkResult"></div>`;
      refreshIcons();checkStatusOnce();
    }
    async function checkStatusOnce(){
      try{
        const res=await API.checkPaymentStatus(orderId);
        if(res?.data){
          const status=res.data.status,resultEl=document.getElementById('checkResult');
          if(status==='settlement'){clearInterval(checkInterval);resultEl.innerHTML=`<div class="payment-status status-success"><i data-lucide="check-circle" class="icon-md"></i> Pembayaran Berhasil!</div><p style="color:var(--text-secondary);">Terima kasih atas donasi Anda. Dana sudah diterima.</p><a href="dashboard.html" class="btn btn-primary btn-block mt-3"><i data-lucide="bar-chart-3" class="icon-sm"></i> Lihat Dashboard</a>`;}
          else if(status==='expire'||status==='deny'||status==='cancel'){clearInterval(checkInterval);resultEl.innerHTML=`<div class="payment-status status-failed"><i data-lucide="x-circle" class="icon-md"></i> Pembayaran ${status==='expire'?'Kedaluwarsa':'Gagal'}</div><p style="color:var(--text-secondary);">Silakan buat donasi baru.</p><a href="campaigns.html" class="btn btn-primary btn-block mt-3">Donasi Lagi</a>`;}
          else{resultEl.innerHTML=`<div class="payment-status status-pending"><i data-lucide="hourglass" class="icon-md"></i> Menunggu Pembayaran</div><p style="color:var(--text-secondary);">Status akan diperbarui otomatis setiap 10 detik.</p><a href="dashboard.html" class="btn btn-outline btn-block mt-3"><i data-lucide="bar-chart-3" class="icon-sm"></i> Ke Dashboard</a>`;}
          refreshIcons();
        }
      }catch(e){console.log('Status check failed');}
    }
    function startCountdown(expDate){const timerEl=document.getElementById('timerCountdown');if(!timerEl)return;const interval=setInterval(()=>{const now=new Date(),diff=expDate-now;if(diff<=0){timerEl.textContent='Kedaluwarsa';clearInterval(interval);return;}const hours=Math.floor(diff/3600000),minutes=Math.floor((diff%3600000)/60000),seconds=Math.floor((diff%60000)/1000);timerEl.textContent=`${hours}j ${minutes}m ${seconds}d`;},1000);}
    function startStatusPolling(orderIdParam){checkInterval=setInterval(async()=>{try{const res=await API.checkPaymentStatus(orderIdParam);if(res?.data?.status==='settlement'){clearInterval(checkInterval);localStorage.removeItem('donaria_payment');const statusEl=document.getElementById('paymentStatus');if(statusEl){statusEl.className='payment-status status-success';statusEl.innerHTML='<i data-lucide="check-circle" class="icon-md"></i> Pembayaran Berhasil!';refreshIcons();}showToast('Pembayaran berhasil diterima!','success');}else if(['expire','deny','cancel'].includes(res?.data?.status)){clearInterval(checkInterval);localStorage.removeItem('donaria_payment');const statusEl=document.getElementById('paymentStatus');if(statusEl){statusEl.className='payment-status status-failed';statusEl.innerHTML='<i data-lucide="x-circle" class="icon-md"></i> Pembayaran Gagal/Kedaluwarsa';refreshIcons();}}}catch(e){}},10000);}
    function copyVA(vaNumber){navigator.clipboard.writeText(vaNumber).then(()=>showToast('Nomor VA berhasil disalin!'));}
    function toggleInstruction(index){document.getElementById(`instructionBody${index}`).classList.toggle('show');}
    document.addEventListener('DOMContentLoaded',loadPayment);
  </script>
</body>
</html>
