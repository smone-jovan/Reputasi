<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Kelola kampanye donasi — Donaria Admin">
  <title>Kelola Kampanye — Donaria Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/21st-premium.css">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            primary: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
            }
          },
          animation: {
            'fade-in-up': 'fadeInUp 0.5s ease-out',
            'fade-in': 'fadeIn 0.3s ease-out',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            }
          }
        }
      }
    }
  </script>
  <style>
    .glass-card {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }
    .glass-nav {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(229, 231, 235, 0.8);
    }
    .form-input {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .form-input:focus {
      box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
    }
    button, a {
      touch-action: manipulation;
    }
    /* Mobile Menu Toggle Logic */
    #mobile-menu {
      display: none;
    }
    #mobile-menu.open {
      display: flex;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    
    /* Modal active logic */
    #campaignModal { display: none; }
    #campaignModal.active { display: flex; }
    /* Sidebar */
    .admin-sidebar {
      width: 260px; min-height: 100vh; background: rgba(255,255,255,0.95); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-right: 1px solid rgba(229,231,235,0.8); position: fixed; top: 0; left: 0; z-index: 50; display: flex; flex-direction: column; transition: transform 0.3s ease;
    }
    .admin-sidebar .nav-link {
      display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; font-size: 0.9rem; font-weight: 500; color: #6b7280; transition: all 0.2s; text-decoration: none;
    }
    .admin-sidebar .nav-link:hover { background: #f9fafb; color: #111827; }
    .admin-sidebar .nav-link.active { background: #ecfdf5; color: #059669; font-weight: 600; }
    .admin-sidebar .nav-link i { width: 20px; height: 20px; }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 40; }
    .sidebar-overlay.show { display: block; }
    @media (max-width: 768px) {
      .admin-sidebar { transform: translateX(-100%); }
      .admin-sidebar.open { transform: translateX(0); }
      .admin-main { margin-left: 0 !important; }
    }
    @media (min-width: 769px) { .sidebar-overlay { display: none !important; } }
  </style>
</head>
<body class="premium-mesh-bg text-gray-800 antialiased">

  <!-- Sidebar Overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <!-- Sidebar -->
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="px-6 py-5 border-b border-gray-100">
      <a href="../index.html" class="flex items-center gap-3 text-lg font-bold tracking-tight text-gray-900">
        <div class="w-9 h-9 bg-primary-600 text-white rounded-xl flex items-center justify-center shadow-md">
          <i data-lucide="heart-handshake" class="w-5 h-5"></i>
        </div>
        <div>Donaria<span class="block text-[0.6rem] font-bold text-primary-600 tracking-wider uppercase">Admin Panel</span></div>
      </a>
    </div>
    <nav class="flex-1 px-4 py-4 space-y-1 overflow-y-auto">
      <a href="index.html" class="nav-link"><i data-lucide="layout-dashboard"></i> Dashboard</a>
      <a href="campaigns.html" class="nav-link active"><i data-lucide="clipboard-list"></i> Kelola Kampanye</a>
      <a href="transactions.html" class="nav-link"><i data-lucide="credit-card"></i> Transaksi</a>
      <a href="../index.html" class="nav-link"><i data-lucide="globe"></i> Lihat Website</a>
    </nav>
    <div class="px-4 py-4 border-t border-gray-100">
      <button onclick="Auth.logout()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 border border-gray-200 rounded-xl text-sm font-semibold text-gray-700 hover:bg-gray-50 transition-colors">
        <i data-lucide="log-out" class="w-4 h-4"></i> Keluar
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="admin-main md:ml-[260px] min-h-screen">
    <div class="md:hidden sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-gray-100 px-4 py-3 flex items-center justify-between">
      <button onclick="toggleSidebar()" class="p-2 rounded-lg text-gray-600 hover:bg-gray-100"><i data-lucide="menu" class="w-6 h-6"></i></button>
      <span class="font-bold text-gray-900">Kelola Kampanye</span>
      <div class="w-10"></div>
    </div>

    <main class="px-4 sm:px-6 lg:px-8 py-6 md:py-8 animate-fade-in-up max-w-7xl">
    
    <!-- Header -->
    <div class="mb-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold text-gray-900 tracking-tight">Kelola Kampanye</h1>
        <p class="text-gray-500 mt-0.5">Buat, edit, dan kelola program donasi</p>
      </div>
      <div>
        <button onclick="openCreateModal()" class="w-full md:w-auto flex justify-center items-center gap-2 py-2.5 px-5 rounded-xl shadow-sm text-sm font-bold text-white bg-gradient-to-r from-primary-600 to-primary-500 hover:from-primary-700 hover:to-primary-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-all transform hover:-translate-y-0.5">
          <i data-lucide="plus" class="w-4 h-4"></i> Buat Kampanye
        </button>
      </div>
    </div>

    <!-- Table Container -->
    <div class="glass-card rounded-2xl overflow-hidden mb-8">
      <div class="overflow-x-auto no-scrollbar">
        <table class="w-full text-left border-collapse min-w-[800px]">
          <thead>
            <tr class="bg-gray-50 border-b border-gray-100 text-xs uppercase tracking-wider font-bold text-gray-500">
              <th class="p-4 pl-6 font-semibold">ID</th>
              <th class="p-4 font-semibold">Judul Kampanye</th>
              <th class="p-4 font-semibold">Kategori</th>
              <th class="p-4 font-semibold text-right">Target (Rp)</th>
              <th class="p-4 font-semibold text-right">Terkumpul (Rp)</th>
              <th class="p-4 font-semibold text-center">Status</th>
              <th class="p-4 pr-6 font-semibold text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="campaignsTableBody" class="divide-y divide-gray-100">
            <tr>
              <td colspan="7" class="p-12 text-center text-gray-500">
                <svg class="animate-spin h-8 w-8 text-primary-500 mx-auto mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                Memuat kampanye...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    </main>
  </div>

  <!-- Create/Edit Modal -->
  <div id="campaignModal" class="fixed inset-0 z-[100] items-center justify-center bg-gray-900/50 backdrop-blur-sm p-4 sm:p-6 overflow-y-auto hidden">
    <div class="bg-white rounded-2xl w-full max-w-xl shadow-2xl relative my-auto animate-fade-in flex flex-col max-h-[90vh]">
      
      <!-- Modal Header -->
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100 flex-shrink-0">
        <h3 id="modalTitle" class="text-xl font-bold text-gray-900">Buat Kampanye Baru</h3>
        <button onclick="closeModal()" class="p-2 text-gray-400 hover:text-gray-600 rounded-lg hover:bg-gray-100 transition-colors" aria-label="Tutup modal">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="p-6 overflow-y-auto no-scrollbar flex-grow">
        
        <div id="modalError" class="hidden mb-5 p-4 bg-red-50 border border-red-200 rounded-xl flex items-start gap-3">
          <i data-lucide="alert-circle" class="w-5 h-5 text-red-600 flex-shrink-0 mt-0.5"></i>
          <span id="modalErrorMsg" class="text-sm text-red-800 font-medium"></span>
        </div>

        <form id="campaignForm" onsubmit="saveCampaign(event)" class="space-y-4">
          <input type="hidden" id="editId">
          
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">Judul Kampanye <span class="text-red-500">*</span></label>
            <input type="text" id="campTitle" required placeholder="Judul kampanye donasi"
              class="form-input w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 focus:outline-none focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10">
          </div>
          
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">Kategori <span class="text-red-500">*</span></label>
            <select id="campCategory" required class="form-input w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 focus:outline-none focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10">
              <option value="">Pilih Kategori</option>
            </select>
          </div>
          
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">Deskripsi Singkat</label>
            <input type="text" id="campShortDesc" placeholder="Ringkasan singkat kampanye"
              class="form-input w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 focus:outline-none focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10">
          </div>
          
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">Deskripsi Lengkap</label>
            <textarea id="campDesc" rows="4" placeholder="Jelaskan detail kampanye..."
              class="form-input w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 focus:outline-none focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 resize-none"></textarea>
          </div>
          
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">Target Dana (Rp) <span class="text-red-500">*</span></label>
            <input type="number" id="campTarget" required min="100000" inputmode="numeric" placeholder="Contoh: 10000000"
              class="form-input w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 focus:outline-none focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10">
          </div>
          
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">URL Banner Image</label>
            <input type="url" id="campBanner" placeholder="https://example.com/banner.jpg"
              class="form-input w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 focus:outline-none focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10">
          </div>
          
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">Batas Waktu (Deadline)</label>
            <input type="date" id="campDeadline" 
              class="form-input w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 focus:outline-none focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10">
          </div>
          
          <div id="statusGroup" class="hidden">
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">Status Kampanye</label>
            <select id="campStatus" class="form-input w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 focus:outline-none focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10">
              <option value="active">Active</option>
              <option value="completed">Completed</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
        </form>
      </div>

      <!-- Modal Footer -->
      <div class="px-6 py-4 border-t border-gray-100 bg-gray-50/50 flex flex-col sm:flex-row justify-end gap-3 rounded-b-2xl flex-shrink-0">
        <button type="button" onclick="closeModal()" class="w-full sm:w-auto px-5 py-2.5 bg-white border border-gray-200 text-gray-700 rounded-xl font-semibold hover:bg-gray-50 transition-colors">
          Batal
        </button>
        <button type="submit" id="saveBtn" onclick="document.getElementById('campaignForm').requestSubmit()" 
          class="w-full sm:w-auto px-5 py-2.5 bg-primary-600 text-white rounded-xl font-semibold hover:bg-primary-700 transition-colors shadow-sm disabled:opacity-70 flex justify-center items-center gap-2">
          Simpan Kampanye
        </button>
      </div>
      
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    lucide.createIcons();

    if(!Auth.isLoggedIn() || !Auth.isAdmin()){
      window.location.href = '../login.html';
    }

    function toggleSidebar(){
      const sidebar = document.getElementById('adminSidebar');
      const overlay = document.getElementById('sidebarOverlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('show');
    }

    function formatMoney(num) {
      if(num >= 1000000) return (num/1000000).toFixed(1).replace(/\.0$/,'') + ' Juta';
      if(num >= 1000) return (num/1000).toFixed(1).replace(/\.0$/,'') + ' Ribu';
      return num.toString();
    }

    let categoriesData=[], campaignsStore={};

    async function loadCategories(){
      try{
        const res = await API.getCategories();
        categoriesData = res?.data?.categories || [];
        const select = document.getElementById('campCategory');
        select.innerHTML = '<option value="">Pilih Kategori</option>' + categoriesData.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      }catch(e){}
    }

    async function loadCampaigns(){
      try{
        const res = await API.getCampaigns({limit:100});
        const tbody = document.getElementById('campaignsTableBody');

        if(res?.data?.campaigns?.length > 0){
          // Sort by ID ascending
          const sortedCampaigns = res.data.campaigns.sort((a, b) => a.id - b.id);

          sortedCampaigns.forEach(c => { campaignsStore[c.id] = c; });

          tbody.innerHTML = sortedCampaigns.map(c => {
            // Helper for progress calculation
            const cur = parseFloat(c.current_amount) || 0;
            const tgt = parseFloat(c.target_amount) || 1;
            const progress = Math.min(Math.round((cur / tgt) * 100), 100);
            
            let statusBadge = '';
            switch(c.status) {
              case 'active': statusBadge = '<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800">Aktif</span>'; break;
              case 'completed': statusBadge = '<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-100 text-blue-800">Selesai</span>'; break;
              case 'cancelled': statusBadge = '<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-red-100 text-red-800">Batal</span>'; break;
              default: statusBadge = `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-gray-100 text-gray-800">${c.status}</span>`;
            }

            return `
              <tr class="hover:bg-gray-50/50 transition-colors">
                <td class="p-4 pl-6 text-sm text-gray-500">${c.id}</td>
                <td class="p-4">
                  <div class="font-bold text-gray-900 truncate max-w-[200px]" title="${c.title}">${c.title}</div>
                </td>
                <td class="p-4 text-sm text-gray-600">${c.category?.name || '-'}</td>
                <td class="p-4 text-right font-medium text-gray-900">${formatMoney(c.target_amount)}</td>
                <td class="p-4 text-right">
                  <div class="font-bold text-primary-700">${formatMoney(c.current_amount)}</div>
                  <div class="text-xs text-gray-500 mt-0.5">${progress}%</div>
                </td>
                <td class="p-4 text-center">${statusBadge}</td>
                <td class="p-4 pr-6">
                  <div class="flex items-center justify-center gap-2">
                    <button class="p-2 bg-gray-50 border border-gray-200 rounded-lg text-gray-600 hover:text-blue-600 hover:bg-blue-50 transition-colors" onclick="openEditModal(campaignsStore[${c.id}])" aria-label="Edit">
                      <i data-lucide="pencil" class="w-4 h-4"></i>
                    </button>
                    <button class="p-2 bg-gray-50 border border-gray-200 rounded-lg text-gray-600 hover:text-red-600 hover:bg-red-50 transition-colors" onclick="deleteCampaign(${c.id})" aria-label="Hapus">
                      <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                  </div>
                </td>
              </tr>
            `;
          }).join('');
          lucide.createIcons();
        } else {
          tbody.innerHTML = '<tr><td colspan="7" class="p-12 text-center text-gray-500">Belum ada kampanye. Klik "Buat Kampanye" untuk mulai.</td></tr>';
        }
      }catch(e){
        console.error('Failed loading campaigns:',e);
        document.getElementById('campaignsTableBody').innerHTML = '<tr><td colspan="7" class="p-12 text-center text-red-500">Gagal memuat kampanye.</td></tr>';
      }
    }

    function openCreateModal(){
      document.getElementById('modalTitle').textContent = 'Buat Kampanye Baru';
      document.getElementById('editId').value = '';
      document.getElementById('campaignForm').reset();
      document.getElementById('statusGroup').classList.add('hidden');
      document.getElementById('modalError').classList.add('hidden');

      const modal = document.getElementById('campaignModal');
      modal.classList.remove('hidden');
      modal.classList.add('active');
    }

    function openEditModal(campaign){
      document.getElementById('modalTitle').textContent = 'Edit Kampanye';
      document.getElementById('editId').value = campaign.id;
      document.getElementById('campTitle').value = campaign.title || '';
      document.getElementById('campCategory').value = campaign.category_id || '';
      document.getElementById('campShortDesc').value = campaign.short_description || '';
      document.getElementById('campDesc').value = campaign.description || '';
      document.getElementById('campTarget').value = campaign.target_amount || '';
      document.getElementById('campBanner').value = campaign.banner_image || '';
      document.getElementById('campDeadline').value = campaign.deadline ? campaign.deadline.split('T')[0] : '';
      document.getElementById('campStatus').value = campaign.status || 'active';

      document.getElementById('statusGroup').classList.remove('hidden');
      document.getElementById('modalError').classList.add('hidden');

      const modal = document.getElementById('campaignModal');
      modal.classList.remove('hidden');
      modal.classList.add('active');
    }

    function closeModal(){
      const modal = document.getElementById('campaignModal');
      modal.classList.remove('active');
      modal.classList.add('hidden');
    }

    async function saveCampaign(e){
      e.preventDefault();
      const btn = document.getElementById('saveBtn');
      const errorBox = document.getElementById('modalError');
      const errorMsg = document.getElementById('modalErrorMsg');
      
      btn.disabled = true;
      btn.innerHTML = '<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Menyimpan...';
      errorBox.classList.add('hidden');
      
      const editId = document.getElementById('editId').value;
      const data = {
        title: document.getElementById('campTitle').value,
        category_id: parseInt(document.getElementById('campCategory').value),
        short_description: document.getElementById('campShortDesc').value,
        description: document.getElementById('campDesc').value,
        target_amount: parseInt(document.getElementById('campTarget').value),
        banner_image: document.getElementById('campBanner').value,
        deadline: document.getElementById('campDeadline').value || null
      };
      
      if(editId) data.status = document.getElementById('campStatus').value;
      
      try{
        if(editId){
          await API.updateCampaign(editId, data);
        } else {
          await API.createCampaign(data);
        }
        closeModal();
        loadCampaigns();
      } catch(error){
        errorMsg.textContent = error.message || 'Gagal menyimpan kampanye.';
        errorBox.classList.remove('hidden');
        lucide.createIcons();
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Simpan Kampanye';
      }
    }

    async function deleteCampaign(id){
      if(!confirm('Yakin ingin menghapus kampanye ini?')) return;
      try{
        await API.deleteCampaign(id);
        loadCampaigns();
      }catch(e){
        alert('Gagal menghapus kampanye.');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadCategories();
      loadCampaigns();
    });
    
    // Close modal on overlay click
    document.getElementById('campaignModal').addEventListener('click', (e) => {
      if(e.target.id === 'campaignModal') closeModal();
    });
    
    // Close modal on Escape key
    document.addEventListener('keydown', (e) => {
      if(e.key === 'Escape' && document.getElementById('campaignModal').classList.contains('active')) {
        closeModal();
      }
    });
  </script>
</body>
</html>
