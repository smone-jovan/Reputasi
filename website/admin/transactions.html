<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Daftar transaksi — Donaria Admin">
  <title>Transaksi — Donaria Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/21st-premium.css">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            primary: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
            }
          },
          animation: {
            'fade-in-up': 'fadeInUp 0.5s ease-out',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    .glass-card {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }
    .glass-nav {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(229, 231, 235, 0.8);
    }
    button, a {
      touch-action: manipulation;
    }
    /* Mobile Menu Toggle Logic */
    #mobile-menu {
      display: none;
    }
    #mobile-menu.open {
      display: flex;
    }
    
    /* Hide scrollbar for clean table scroll */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* Sidebar */
    .admin-sidebar {
      width: 260px; min-height: 100vh; background: rgba(255,255,255,0.95); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-right: 1px solid rgba(229,231,235,0.8); position: fixed; top: 0; left: 0; z-index: 50; display: flex; flex-direction: column; transition: transform 0.3s ease;
    }
    .admin-sidebar .nav-link {
      display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; font-size: 0.9rem; font-weight: 500; color: #6b7280; transition: all 0.2s; text-decoration: none;
    }
    .admin-sidebar .nav-link:hover { background: #f9fafb; color: #111827; }
    .admin-sidebar .nav-link.active { background: #ecfdf5; color: #059669; font-weight: 600; }
    .admin-sidebar .nav-link i { width: 20px; height: 20px; }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 40; }
    .sidebar-overlay.show { display: block; }
    @media (max-width: 768px) {
      .admin-sidebar { transform: translateX(-100%); }
      .admin-sidebar.open { transform: translateX(0); }
      .admin-main { margin-left: 0 !important; }
    }
    @media (min-width: 769px) { .sidebar-overlay { display: none !important; } }
  </style>
</head>
<body class="premium-mesh-bg text-gray-800 antialiased">

  <!-- Sidebar Overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <!-- Sidebar -->
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="px-6 py-5 border-b border-gray-100">
      <a href="../index.html" class="flex items-center gap-3 text-lg font-bold tracking-tight text-gray-900">
        <div class="w-9 h-9 bg-primary-600 text-white rounded-xl flex items-center justify-center shadow-md">
          <i data-lucide="heart-handshake" class="w-5 h-5"></i>
        </div>
        <div>Donaria<span class="block text-[0.6rem] font-bold text-primary-600 tracking-wider uppercase">Admin Panel</span></div>
      </a>
    </div>
    <nav class="flex-1 px-4 py-4 space-y-1 overflow-y-auto">
      <a href="index.html" class="nav-link"><i data-lucide="layout-dashboard"></i> Dashboard</a>
      <a href="campaigns.html" class="nav-link"><i data-lucide="clipboard-list"></i> Kelola Kampanye</a>
      <a href="transactions.html" class="nav-link active"><i data-lucide="credit-card"></i> Transaksi</a>
      <a href="../index.html" class="nav-link"><i data-lucide="globe"></i> Lihat Website</a>
    </nav>
    <div class="px-4 py-4 border-t border-gray-100">
      <button onclick="Auth.logout()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 border border-gray-200 rounded-xl text-sm font-semibold text-gray-700 hover:bg-gray-50 transition-colors">
        <i data-lucide="log-out" class="w-4 h-4"></i> Keluar
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="admin-main md:ml-[260px] min-h-screen">
    <div class="md:hidden sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-gray-100 px-4 py-3 flex items-center justify-between">
      <button onclick="toggleSidebar()" class="p-2 rounded-lg text-gray-600 hover:bg-gray-100"><i data-lucide="menu" class="w-6 h-6"></i></button>
      <span class="font-bold text-gray-900">Transaksi</span>
      <div class="w-10"></div>
    </div>

    <main class="px-4 sm:px-6 lg:px-8 py-6 md:py-8 animate-fade-in-up max-w-7xl">
    
    <!-- Header -->
    <div class="mb-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold text-gray-900 tracking-tight">Transaksi</h1>
        <p class="text-gray-500 mt-0.5">Semua riwayat pembayaran donasi</p>
      </div>
    </div>

    <!-- Filters -->
    <div class="glass-card p-4 rounded-2xl mb-6">
      
      <!-- Status Filter -->
      <div class="mb-4">
        <div class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Status Pembayaran</div>
        <div class="flex gap-2 flex-wrap" id="statusFilters">
          <button class="status-btn active px-4 py-2 rounded-xl text-sm font-semibold transition-colors bg-primary-50 text-primary-700 border border-primary-200" onclick="filterStatus(null, this)">Semua</button>
          <button class="status-btn px-4 py-2 rounded-xl text-sm font-semibold transition-colors bg-white text-gray-600 border border-gray-200 hover:bg-gray-50" onclick="filterStatus('pending', this)">
            <span class="flex items-center gap-1.5"><i data-lucide="hourglass" class="w-4 h-4"></i> Pending</span>
          </button>
          <button class="status-btn px-4 py-2 rounded-xl text-sm font-semibold transition-colors bg-white text-gray-600 border border-gray-200 hover:bg-gray-50" onclick="filterStatus('settlement', this)">
            <span class="flex items-center gap-1.5"><i data-lucide="check-circle" class="w-4 h-4"></i> Settlement</span>
          </button>
          <button class="status-btn px-4 py-2 rounded-xl text-sm font-semibold transition-colors bg-white text-gray-600 border border-gray-200 hover:bg-gray-50" onclick="filterStatus('expire', this)">
            <span class="flex items-center gap-1.5"><i data-lucide="clock" class="w-4 h-4"></i> Expired</span>
          </button>
          <button class="status-btn px-4 py-2 rounded-xl text-sm font-semibold transition-colors bg-white text-gray-600 border border-gray-200 hover:bg-gray-50" onclick="filterStatus('deny', this)">
            <span class="flex items-center gap-1.5"><i data-lucide="x-circle" class="w-4 h-4"></i> Denied</span>
          </button>
        </div>
      </div>

      <!-- Source Filter -->
      <div>
        <div class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Sumber Transaksi</div>
        <div class="flex gap-2 flex-wrap" id="sourceFilters">
          <button class="source-btn active px-4 py-2 rounded-xl text-sm font-semibold transition-colors bg-gray-100 text-gray-900 border border-gray-200" onclick="filterSource(null, this)">Semua Sumber</button>
          <button class="source-btn px-4 py-2 rounded-xl text-sm font-semibold transition-colors bg-white text-emerald-600 border border-emerald-200 hover:bg-emerald-50" onclick="filterSource('real', this)">
            <span class="flex items-center gap-1.5"><i data-lucide="shield-check" class="w-4 h-4"></i> Real</span>
          </button>
          <button class="source-btn px-4 py-2 rounded-xl text-sm font-semibold transition-colors bg-white text-amber-600 border border-amber-200 hover:bg-amber-50" onclick="filterSource('demo', this)">
            <span class="flex items-center gap-1.5"><i data-lucide="flask-conical" class="w-4 h-4"></i> Demo</span>
          </button>
          <button class="source-btn px-4 py-2 rounded-xl text-sm font-semibold transition-colors bg-white text-blue-600 border border-blue-200 hover:bg-blue-50" onclick="filterSource('test', this)">
            <span class="flex items-center gap-1.5"><i data-lucide="test-tubes" class="w-4 h-4"></i> Test Mode</span>
          </button>
        </div>
      </div>

    </div>

    <!-- Table Container -->
    <div class="glass-card rounded-2xl overflow-hidden mb-8">
      <div class="overflow-x-auto no-scrollbar">
        <table class="w-full text-left border-collapse min-w-[800px]">
          <thead>
            <tr class="bg-gray-50 border-b border-gray-100 text-xs uppercase tracking-wider font-bold text-gray-500">
              <th class="p-4 pl-6 font-semibold">Order ID</th>
              <th class="p-4 font-semibold">Donatur</th>
              <th class="p-4 font-semibold">Kampanye</th>
              <th class="p-4 font-semibold text-right">Jumlah (Rp)</th>
              <th class="p-4 font-semibold text-center">Metode</th>
              <th class="p-4 font-semibold text-center">Status</th>
              <th class="p-4 pr-6 font-semibold text-right">Tanggal</th>
            </tr>
          </thead>
          <tbody id="transactionsTable" class="divide-y divide-gray-100">
            <tr>
              <td colspan="7" class="p-12 text-center text-gray-500">
                <svg class="animate-spin h-8 w-8 text-primary-500 mx-auto mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                Memuat data transaksi...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      
      <!-- Pagination -->
      <div class="px-6 py-4 border-t border-gray-100 bg-gray-50/50 flex justify-center" id="paginationContainer">
        <div class="flex gap-2" id="paginationButtons"></div>
      </div>
    </div>
    </main>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    lucide.createIcons();

    if(!Auth.isLoggedIn() || !Auth.isAdmin()){
      window.location.href = '../login.html';
    }

    function toggleSidebar(){
      const sidebar = document.getElementById('adminSidebar');
      const overlay = document.getElementById('sidebarOverlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('show');
    }

    function formatDateIndo(dateStr) {
      if(!dateStr) return '-';
      const d = new Date(dateStr);
      return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour:'2-digit', minute:'2-digit' });
    }

    async function loadTransactions(){
      const tbody = document.getElementById('transactionsTable');
      try{
        const params = { page: currentPage, limit: 10 };
        if(currentStatus) params.status = currentStatus;
        if(currentSource) params.source = currentSource;
        
        const res = await apiFetch(`/transactions?${new URLSearchParams(params)}`);
        if(res?.data?.transactions?.length > 0){
          tbody.innerHTML = res.data.transactions.map(t => {
            const donation = t.donation || {}, donatur = donation.donatur || {}, campaign = donation.campaign || {};
            const isDemo = t.order_id && t.order_id.startsWith('DEMO-');
            const isTest = t.order_id && t.order_id.startsWith('TEST-');
            
            const sourceBadge = isDemo 
              ? '<span class="ml-2 inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[0.65rem] font-bold bg-amber-100 text-amber-800"><i data-lucide="flask-conical" class="w-3 h-3"></i> DEMO</span>'
              : isTest
                ? '<span class="ml-2 inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[0.65rem] font-bold bg-blue-100 text-blue-800"><i data-lucide="test-tubes" class="w-3 h-3"></i> TEST</span>'
                : '';
            
            const methodHtml = isDemo 
              ? `<div class="flex items-center justify-center gap-1 text-amber-600"><i data-lucide="flask-conical" class="w-4 h-4"></i> Demo</div>`
              : isTest
                ? `<div class="flex items-center justify-center gap-1 text-blue-600"><i data-lucide="test-tubes" class="w-4 h-4"></i> Test</div>`
                : t.payment_method === 'qris' 
                  ? `<div class="flex items-center justify-center gap-1"><i data-lucide="qr-code" class="w-4 h-4"></i> QRIS</div>`
                  : `<div class="flex items-center justify-center gap-1"><i data-lucide="building-2" class="w-4 h-4"></i> ${(t.bank_code||'').toUpperCase()}</div>`;

            let statusBadge = '';
            switch(t.status) {
              case 'pending': statusBadge = '<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-100 text-amber-800">Pending</span>'; break;
              case 'settlement': statusBadge = '<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800">Sukses</span>'; break;
              case 'expire': statusBadge = '<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-red-100 text-red-800">Expired</span>'; break;
              case 'deny': statusBadge = '<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-red-100 text-red-800">Ditolak</span>'; break;
              case 'cancel': statusBadge = '<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-gray-100 text-gray-800">Batal</span>'; break;
              default: statusBadge = `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-gray-100 text-gray-800">${t.status}</span>`;
            }

            return `
              <tr class="hover:bg-gray-50/50 transition-colors ${isDemo ? 'bg-amber-50/30' : isTest ? 'bg-blue-50/30' : ''}">
                <td class="p-4 pl-6">
                  <div class="flex items-center">
                    <code class="text-xs font-mono bg-white border border-gray-200 px-2 py-1 rounded text-gray-600">${t.order_id}</code>
                    ${sourceBadge}
                  </div>
                </td>
                <td class="p-4">
                  <div class="font-semibold text-gray-900">${donatur.name || 'Hamba Allah'}</div>
                  <div class="text-xs text-gray-500">${donatur.email || '-'}</div>
                </td>
                <td class="p-4">
                  <div class="text-sm text-gray-700 truncate max-w-[200px]" title="${campaign.title || '-'}">${campaign.title || '-'}</div>
                </td>
                <td class="p-4 text-right font-bold text-primary-700">
                  Rp ${formatMoney(t.gross_amount)}
                </td>
                <td class="p-4 text-center text-sm font-medium text-gray-600">
                  ${methodHtml}
                </td>
                <td class="p-4 text-center">
                  ${statusBadge}
                </td>
                <td class="p-4 pr-6 text-right text-xs text-gray-500">
                  ${formatDateIndo(t.created_at)}
                </td>
              </tr>
            `;
          }).join('');
          
          // Pagination
          const pagination = res.data.pagination;
          const buttons = document.getElementById('paginationButtons');
          if(pagination.totalPages > 1){
            let html = '';
            for(let i=1; i<=pagination.totalPages; i++){
              if(i === pagination.page) {
                html += `<button class="w-8 h-8 rounded-lg flex items-center justify-center text-sm font-bold bg-primary-600 text-white shadow-sm" onclick="goToPage(${i})">${i}</button>`;
              } else {
                html += `<button class="w-8 h-8 rounded-lg flex items-center justify-center text-sm font-medium bg-white border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors" onclick="goToPage(${i})">${i}</button>`;
              }
            }
            buttons.innerHTML = html;
          }else{
            buttons.innerHTML = '';
          }
          lucide.createIcons();
        }else{
          tbody.innerHTML = '<tr><td colspan="7" class="p-12 text-center text-gray-500">Tidak ada transaksi ditemukan.</td></tr>';
          document.getElementById('paginationButtons').innerHTML = '';
        }
      }catch(e){
        tbody.innerHTML = '<tr><td colspan="7" class="p-12 text-center text-red-500">Gagal memuat data transaksi.</td></tr>';
      }
    }

    function filterStatus(status, el){
      currentStatus = status;
      currentPage = 1;
      
      const buttons = document.querySelectorAll('.status-btn');
      buttons.forEach(b => {
        b.className = 'status-btn px-4 py-2 rounded-xl text-sm font-semibold transition-colors bg-white text-gray-600 border border-gray-200 hover:bg-gray-50';
      });
      el.className = 'status-btn active px-4 py-2 rounded-xl text-sm font-semibold transition-colors bg-primary-50 text-primary-700 border border-primary-200';
      
      loadTransactions();
    }

    function filterSource(source, el){
      currentSource = source;
      currentPage = 1;
      
      const buttons = document.querySelectorAll('.source-btn');
      buttons.forEach(b => {
        if(b.innerText.includes('Real')) {
          b.className = 'source-btn px-4 py-2 rounded-xl text-sm font-semibold transition-colors bg-white text-emerald-600 border border-emerald-200 hover:bg-emerald-50';
        } else if(b.innerText.includes('Demo')) {
          b.className = 'source-btn px-4 py-2 rounded-xl text-sm font-semibold transition-colors bg-white text-amber-600 border border-amber-200 hover:bg-amber-50';
        } else if(b.innerText.includes('Test Mode')) {
          b.className = 'source-btn px-4 py-2 rounded-xl text-sm font-semibold transition-colors bg-white text-blue-600 border border-blue-200 hover:bg-blue-50';
        } else {
          b.className = 'source-btn active px-4 py-2 rounded-xl text-sm font-semibold transition-colors bg-white text-gray-600 border border-gray-200 hover:bg-gray-50';
        }
      });
      
      if(!source) {
        el.className = 'source-btn active px-4 py-2 rounded-xl text-sm font-semibold transition-colors bg-gray-100 text-gray-900 border border-gray-200';
      } else if (source === 'real') {
        el.className = 'source-btn px-4 py-2 rounded-xl text-sm font-semibold transition-colors bg-emerald-50 text-emerald-800 border border-emerald-300';
      } else if (source === 'demo') {
        el.className = 'source-btn px-4 py-2 rounded-xl text-sm font-semibold transition-colors bg-amber-50 text-amber-800 border border-amber-300';
      } else if (source === 'test') {
        el.className = 'source-btn px-4 py-2 rounded-xl text-sm font-semibold transition-colors bg-blue-50 text-blue-800 border border-blue-300';
      }

      loadTransactions();
    }

    function goToPage(page){
      currentPage = page;
      loadTransactions();
      window.scrollTo({top:0, behavior:'smooth'});
    }

    document.addEventListener('DOMContentLoaded', loadTransactions);
  </script>
</body>
</html>
