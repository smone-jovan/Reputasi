<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Daftar transaksi — Donaria Admin">
  <title>Transaksi — Donaria Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Langsung ke konten utama</a>
  <nav class="navbar" id="navbar">
    <div class="container">
      <a href="../index.html" class="navbar-brand"><span class="logo-icon"><i data-lucide="heart-handshake" style="color:white;width:20px;height:20px;"></i></span><span>Donaria</span></a>
      <div class="navbar-nav" id="navbarNav">
        <a href="index.html">Dashboard</a><a href="campaigns.html">Kampanye</a><a href="transactions.html" class="active">Transaksi</a><a href="../index.html">Website</a>
      </div>
      <div class="navbar-actions" id="navbarActions">
        <span class="badge badge-primary">Admin</span>
        <button class="btn btn-sm btn-outline" onclick="Auth.logout()">Keluar</button>
      </div>
      <button class="navbar-toggle" id="navbarToggle" aria-label="Buka menu navigasi"><i data-lucide="menu" class="icon-lg"></i></button>
    </div>
  </nav>

  <div class="dashboard" id="main-content">
    <div class="container">
      <div class="dashboard-header">
        <h1><i data-lucide="credit-card" class="icon-xl"></i> Transaksi</h1>
        <p>Semua transaksi pembayaran donasi</p>
      </div>
      <div class="d-flex gap-2 flex-wrap mb-3" style="margin-bottom:12px;">
        <button class="btn btn-sm btn-primary" onclick="filterStatus(null,this)" id="filterAll">Semua</button>
        <button class="btn btn-sm btn-outline" onclick="filterStatus('pending',this)"><i data-lucide="hourglass" class="icon-sm"></i> Pending</button>
        <button class="btn btn-sm btn-outline" onclick="filterStatus('settlement',this)"><i data-lucide="check-circle" class="icon-sm"></i> Settlement</button>
        <button class="btn btn-sm btn-outline" onclick="filterStatus('expire',this)"><i data-lucide="clock" class="icon-sm"></i> Expired</button>
        <button class="btn btn-sm btn-outline" onclick="filterStatus('deny',this)"><i data-lucide="x-circle" class="icon-sm"></i> Denied</button>
      </div>
      <div class="d-flex gap-2 flex-wrap mb-3" style="margin-bottom:24px;">
        <span style="font-size:0.85rem;font-weight:600;color:#6B7280;padding:6px 0;">Sumber:</span>
        <button class="btn btn-sm btn-outline source-btn active-source" onclick="filterSource(null,this)" id="sourceAll" style="font-size:0.8rem;">Semua</button>
        <button class="btn btn-sm btn-outline source-btn" onclick="filterSource('real',this)" style="font-size:0.8rem;border-color:#10B981;color:#059669;"><i data-lucide="shield-check" class="icon-sm"></i> Real</button>
        <button class="btn btn-sm btn-outline source-btn" onclick="filterSource('demo',this)" style="font-size:0.8rem;border-color:#F59E0B;color:#D97706;"><i data-lucide="flask-conical" class="icon-sm"></i> Demo Test</button>
      </div>
      <div class="table-container" style="margin-bottom:60px;">
        <div style="overflow-x:auto;">
          <table>
            <thead><tr><th>Order ID</th><th>Donatur</th><th>Kampanye</th><th>Jumlah</th><th>Metode</th><th>Status</th><th>Tanggal</th></tr></thead>
            <tbody id="transactionsTable"><tr><td colspan="7" class="text-center" style="padding:40px;"><div class="spinner" style="margin:0 auto 12px;"></div>Memuat...</td></tr></tbody>
          </table>
        </div>
        <div class="text-center" style="padding:20px;" id="paginationContainer"><div class="d-flex gap-1" style="justify-content:center;" id="paginationButtons"></div></div>
      </div>
    </div>
  </div>

  <style>
    .source-btn{transition:all 0.2s;}
    .active-source{background:#F3F4F6 !important;font-weight:700 !important;}
    .demo-badge{display:inline-flex;align-items:center;gap:4px;background:#FEF3C7;color:#92400E;padding:2px 8px;border-radius:4px;font-size:0.7rem;font-weight:700;margin-left:6px;}
  </style>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    let currentPage=1,currentStatus=null,currentSource=null;
    async function loadTransactions(){
      const tbody=document.getElementById('transactionsTable');
      try{
        const params={page:currentPage,limit:20};
        if(currentStatus)params.status=currentStatus;
        if(currentSource)params.source=currentSource;
        const res=await apiFetch(`/transactions?${new URLSearchParams(params)}`);
        if(res?.data?.transactions?.length>0){
          tbody.innerHTML=res.data.transactions.map(t=>{
            const donation=t.donation||{},donatur=donation.donatur||{},campaign=donation.campaign||{};
            const isDemo=t.order_id&&t.order_id.startsWith('DEMO-');
            const demoBadge=isDemo?'<span class="demo-badge"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/></svg> DEMO</span>':'';
            const statusBadge={
              pending:'<span class="badge badge-warning"><svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Pending</span>',
              settlement:'<span class="badge badge-success"><svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg> Settlement</span>',
              expire:'<span class="badge badge-danger"><svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg> Expired</span>',
              deny:'<span class="badge badge-danger"><svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg> Denied</span>',
              cancel:'<span class="badge badge-info"><svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg> Cancelled</span>',
            };
            return `<tr style="${isDemo?'background:rgba(245,158,11,0.04);':''}"><td><code style="font-size:0.8rem;background:var(--gray-100);padding:2px 8px;border-radius:4px;">${t.order_id}</code>${demoBadge}</td><td>${donatur.name||'-'}<br><small style="color:var(--text-muted);">${donatur.email||''}</small></td><td style="max-width:200px;">${campaign.title||'-'}</td><td style="font-weight:600;color:var(--primary-dark);">${formatCurrency(t.gross_amount)}</td><td>${isDemo?'<i data-lucide="flask-conical" class="icon-sm" style="color:#D97706;"></i> Demo':t.payment_method==='qris'?'<i data-lucide="qr-code" class="icon-sm"></i> QRIS':`<i data-lucide="building-2" class="icon-sm"></i> ${(t.bank_code||'').toUpperCase()}`}</td><td>${statusBadge[t.status]||t.status}</td><td style="font-size:0.85rem;color:var(--text-muted);">${formatDate(t.created_at)}</td></tr>`;
          }).join('');
          const pagination=res.data.pagination,buttons=document.getElementById('paginationButtons');
          if(pagination.totalPages>1){let html='';for(let i=1;i<=pagination.totalPages;i++){html+=`<button class="btn btn-sm ${i===pagination.page?'btn-primary':'btn-outline'}" onclick="goToPage(${i})">${i}</button>`;}buttons.innerHTML=html;}else{buttons.innerHTML='';}
          refreshIcons();
        }else{tbody.innerHTML='<tr><td colspan="7" class="text-center" style="padding:60px;">Tidak ada transaksi.</td></tr>';document.getElementById('paginationButtons').innerHTML='';}
      }catch(e){tbody.innerHTML='<tr><td colspan="7" class="text-center" style="padding:60px;">Gagal memuat data transaksi.</td></tr>';}
    }
    function filterStatus(status,el){currentStatus=status;currentPage=1;document.querySelectorAll('.dashboard-header ~ .d-flex:first-of-type .btn').forEach(b=>{b.className='btn btn-sm btn-outline';});el.className='btn btn-sm btn-primary';loadTransactions();}
    function filterSource(source,el){currentSource=source;currentPage=1;document.querySelectorAll('.source-btn').forEach(b=>{b.classList.remove('active-source');});el.classList.add('active-source');loadTransactions();}
    function goToPage(page){currentPage=page;loadTransactions();window.scrollTo({top:0,behavior:'smooth'});}
    document.addEventListener('DOMContentLoaded',loadTransactions);
  </script>
</body>
</html>
